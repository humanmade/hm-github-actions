name: Block pattern diff comment
description: Comments on a pull request with a link to a structural diff of any changed block pattern or template files, updating or removing the comment as the pull request changes.
author: Human Made

inputs:
  theme_directories:
    description: |
      Theme directories to watch, one per line. Use "." for a repository that
      is itself a theme. Paths are relative to the repository root.
    default: "."
    required: false
  file_pattern:
    description: |
      Extended regular expression matched against each changed file's path
      relative to a theme directory. The default covers block patterns,
      templates, template parts, and HTML files at the theme root.
    default: '^(patterns/.+\.(php|html)|templates/.+\.html|parts/.+\.html|[^/]+\.html)$'
    required: false
  include_added:
    description: |
      Include files added by the pull request. A new pattern renders as an
      all-added block tree. Set to false to see only changes to patterns that
      already existed.
    default: "true"
    required: false
  include_removed:
    description: |
      Include files the pull request deletes. A deleted pattern renders as an
      all-removed block tree.
    default: "true"
    required: false
  site_url:
    description: Base URL of the Block Pattern Diff tool.
    default: "https://humanmade.github.io/block-pattern-diff/"
    required: false
  view:
    description: Which view the link opens; "unified" or "sbs".
    default: unified
    required: false
  comment_id:
    description: |
      Identifier embedded in the comment so it can be found and updated later.
      Change it if you run this action more than once on the same pull request.
    default: block-pattern-diff
    required: false
  max_url_length:
    description: |
      Longest link to build. Files are packed into as few links as fit under
      this. GitHub Pages answers 414 past roughly 8190 characters, so raising
      this much above the default will produce links that do not load.
    default: "8000"
    required: false
  github_token:
    description: Token used for GitHub API calls. Defaults to the job's GITHUB_TOKEN.
    default: ${{ github.token }}
    required: false

outputs:
  url:
    description: The first Block Pattern Diff link, empty if nothing could be linked.
    value: ${{ steps.diff.outputs.url }}
  link_count:
    description: How many links the diff was split across.
    value: ${{ steps.diff.outputs.link_count }}
  changed_files:
    description: Number of pattern or template files changed.
    value: ${{ steps.diff.outputs.changed_files }}
  comment_action:
    description: What happened to the comment — created, updated, unchanged, deleted, or none.
    value: ${{ steps.comment.outputs.comment_action }}

runs:
  using: composite

  steps:
    - name: Collect the pattern diff
      id: diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        THEME_DIRECTORIES: ${{ inputs.theme_directories }}
        FILE_PATTERN: ${{ inputs.file_pattern }}
        INCLUDE_ADDED: ${{ inputs.include_added }}
        INCLUDE_REMOVED: ${{ inputs.include_removed }}
        SITE_URL: ${{ inputs.site_url }}
        VIEW: ${{ inputs.view }}
        MAX_URL_LENGTH: ${{ inputs.max_url_length }}
      run: |
        set -euo pipefail

        if [ -z "${PR_NUMBER:-}" ]; then
          echo "::error::This action must run on a pull_request or pull_request_target event."
          exit 1
        fi

        # Everything comes from the API rather than a checkout: no working copy
        # is needed, and nothing from the pull request is ever executed. That is
        # what makes this safe to run on pull_request_target for forks.
        # Reject anything that is not a plain boolean rather than quietly
        # reading it as false, which would silently drop files.
        for pair in "include_added:$INCLUDE_ADDED" "include_removed:$INCLUDE_REMOVED"; do
          name="${pair%%:*}"
          value=$(echo "${pair#*:}" | tr '[:upper:]' '[:lower:]')
          case "$value" in
            true|false) ;;
            *) echo "::error::$name must be true or false, got \"${pair#*:}\"."; exit 1 ;;
          esac
        done
        INCLUDE_ADDED=$(echo "$INCLUDE_ADDED" | tr '[:upper:]' '[:lower:]')
        INCLUDE_REMOVED=$(echo "$INCLUDE_REMOVED" | tr '[:upper:]' '[:lower:]')

        # Renamed and modified files always count; only whole-file additions and
        # deletions are optional, since those are the ones a reviewer might
        # already have covered elsewhere.
        status_filter="true"
        [ "$INCLUDE_ADDED" = "true" ] || status_filter="$status_filter and .status != \"added\""
        [ "$INCLUDE_REMOVED" = "true" ] || status_filter="$status_filter and .status != \"removed\""

        gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
          --jq ".[] | select($status_filter) | .filename" > "$RUNNER_TEMP/all-files.txt"

        # Keep files that sit under one of the watched theme directories and
        # match the pattern once that directory prefix is stripped.
        : > "$RUNNER_TEMP/matched.txt"
        while IFS= read -r dir; do
          dir="$(echo "$dir" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [ -n "$dir" ] || continue
          if [ "$dir" = "." ]; then
            prefix=""
          else
            prefix="${dir%/}/"
          fi
          while IFS= read -r file; do
            case "$file" in
              "$prefix"*) relative="${file#"$prefix"}" ;;
              *) continue ;;
            esac
            # A file directly under the repo root can only match when the theme
            # directory is "."; otherwise the prefix strip above did nothing.
            [ -n "$prefix" ] || [ "$dir" = "." ] || continue
            if echo "$relative" | grep -Eq "$FILE_PATTERN"; then
              echo "$file" >> "$RUNNER_TEMP/matched.txt"
            fi
          done < "$RUNNER_TEMP/all-files.txt"
        done <<< "$THEME_DIRECTORIES"

        sort -u "$RUNNER_TEMP/matched.txt" -o "$RUNNER_TEMP/matched.txt"
        count=$(wc -l < "$RUNNER_TEMP/matched.txt" | tr -d ' ')
        echo "changed_files=$count" >> "$GITHUB_OUTPUT"

        if [ "$count" -eq 0 ]; then
          echo "No pattern or template changes in the watched directories."
          echo "url=" >> "$GITHUB_OUTPUT"
          echo "link_count=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Matched $count file(s):"
        sed 's/^/  /' "$RUNNER_TEMP/matched.txt"

        gh api "repos/$REPO/pulls/$PR_NUMBER" \
          -H "Accept: application/vnd.github.diff" > "$RUNNER_TEMP/full.diff"

        # Split the diff into one file per changed path, keeping only the matched
        # ones. The decision is made on the `+++ b/` line rather than the
        # `diff --git` line, because that line holds a single path and so stays
        # unambiguous when a path contains a space. Deleted files carry
        # `+++ /dev/null`, so fall back to `--- a/`.
        #
        # `index <sha>..<sha>` lines are dropped: the tool never reads them, and
        # they are pure payload.
        chunks="$RUNNER_TEMP/chunks"
        rm -rf "$chunks" && mkdir -p "$chunks"

        awk -v WANTED="$RUNNER_TEMP/matched.txt" -v OUT="$chunks" '
          function flush() {
            resolve()
            if ( keep && buffer != "" ) {
              n++
              printf "%s", buffer > ( OUT "/" sprintf( "%04d", n ) ".diff" )
              close( OUT "/" sprintf( "%04d", n ) ".diff" )
              print path > ( OUT "/" sprintf( "%04d", n ) ".path" )
              close( OUT "/" sprintf( "%04d", n ) ".path" )
            }
            buffer = ""; keep = 0; path = ""; plus = ""; minus = ""
          }
          function resolve() {
            # The files API names a renamed file by its new path, so prefer the
            # `+++` side and fall back to `---` only for deletions.
            path = ( plus != "" && plus != "/dev/null" ) ? plus : minus
            keep = ( path != "" && path != "/dev/null" && ( path in wanted ) )
          }
          BEGIN {
            while ( ( getline line < WANTED ) > 0 ) wanted[ line ] = 1
          }
          /^diff --git / { flush(); buffer = $0 ORS; next }
          /^index [0-9a-f]+\.\.[0-9a-f]+/ { next }
          { buffer = buffer $0 ORS }
          /^\+\+\+ / {
            tail = substr( $0, 5 )
            plus = ( tail ~ /^b\// ) ? substr( tail, 3 ) : tail
          }
          /^--- / {
            tail = substr( $0, 5 )
            minus = ( tail ~ /^a\// ) ? substr( tail, 3 ) : tail
          }
          END { flush() }
        ' "$RUNNER_TEMP/full.diff"

        if [ -z "$( ls -A "$chunks" 2>/dev/null )" ]; then
          echo "::error::Matched $count file(s) but extracted no diff sections for them."
          exit 1
        fi

        # gzip then base64url, matching the tool's "z" payload scheme. -n omits
        # the timestamp and filename from the header, so an unchanged diff always
        # encodes to the same string and the comment is not rewritten needlessly.
        encode_url() {
          local payload
          payload=$(gzip -n -9 -c "$1" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          printf '%s/?d=z%s&view=%s' "${SITE_URL%/}" "$payload" "$VIEW"
        }

        # Pack whole files into as few links as possible. GitHub Pages answers
        # 414 past roughly 8 kB of URL, so one link cannot always carry a whole
        # pull request. Packing rather than one-link-per-file keeps related
        # files together and keeps the comment short; it falls back to one file
        # per link naturally when the files are large.
        links="$RUNNER_TEMP/links"
        rm -rf "$links" && mkdir -p "$links"
        : > "$RUNNER_TEMP/unlinkable.txt"

        group=0
        pending="$RUNNER_TEMP/pending.diff"
        : > "$pending"
        pending_files="$RUNNER_TEMP/pending.txt"
        : > "$pending_files"

        emit_group() {
          [ -s "$pending" ] || return 0
          group=$(( group + 1 ))
          encode_url "$pending" > "$links/$group.url"
          cp "$pending_files" "$links/$group.files"
          : > "$pending"
          : > "$pending_files"
        }

        for chunk in "$chunks"/*.diff; do
          path=$(cat "${chunk%.diff}.path")
          cat "$pending" "$chunk" > "$RUNNER_TEMP/candidate.diff"
          candidate_url=$(encode_url "$RUNNER_TEMP/candidate.diff")
          if [ "${#candidate_url}" -le "$MAX_URL_LENGTH" ]; then
            mv "$RUNNER_TEMP/candidate.diff" "$pending"
            echo "$path" >> "$pending_files"
            continue
          fi

          # Adding this file overflowed. Close the group and start a new one
          # with just this file, unless it does not fit on its own either.
          emit_group
          solo_url=$(encode_url "$chunk")
          if [ "${#solo_url}" -le "$MAX_URL_LENGTH" ]; then
            cp "$chunk" "$pending"
            echo "$path" > "$pending_files"
          else
            echo "$path" >> "$RUNNER_TEMP/unlinkable.txt"
            echo "::notice::$path is too large to link on its own (${#solo_url} characters)."
          fi
        done
        emit_group

        link_count=$group
        echo "link_count=$link_count" >> "$GITHUB_OUTPUT"
        echo "url=$( [ "$link_count" -ge 1 ] && cat "$links/1.url" || echo '' )" >> "$GITHUB_OUTPUT"
        echo "Built $link_count link(s); $(wc -l < "$RUNNER_TEMP/unlinkable.txt" | tr -d ' ') file(s) too large to link."

    - name: Create, update or remove the comment
      id: comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_ID: ${{ inputs.comment_id }}
        URL: ${{ steps.diff.outputs.url }}
        LINK_COUNT: ${{ steps.diff.outputs.link_count }}
        COUNT: ${{ steps.diff.outputs.changed_files }}
        SITE_URL: ${{ inputs.site_url }}
      run: |
        set -euo pipefail

        marker="<!-- block-pattern-diff:${COMMENT_ID} -->"

        # Find our previous comment, if any, by its hidden marker.
        existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq "[ .[] | select( .body | contains(\"$marker\") ) ] | first | .id // empty")

        # No relevant files left: take the comment down rather than leaving a
        # link to a diff that no longer exists.
        if [ "$COUNT" -eq 0 ]; then
          if [ -n "$existing" ]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$existing"
            echo "Removed the previous comment; no pattern changes remain."
            echo "comment_action=deleted" >> "$GITHUB_OUTPUT"
          else
            echo "comment_action=none" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi

        if [ "$COUNT" -eq 1 ]; then
          subject="1 pattern or template file"
        else
          subject="$COUNT pattern and template files"
        fi

        links="$RUNNER_TEMP/links"
        unlinkable="$RUNNER_TEMP/unlinkable.txt"
        link_count="${LINK_COUNT:-0}"

        # Filenames come from the pull request. Rendering them in Markdown code
        # spans would let a backtick in a filename close the span and inject
        # markup into a comment written by the bot, so escape them and use an
        # HTML code element instead.
        list_files() {
          sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
              -e "s|^|${2}- <code>|" -e 's|$|</code>|' "$1"
        }

        # GitHub rejects a comment body over 65536 characters. Near-limit links
        # are ~8 kB each, so a large enough pull request would otherwise build a
        # body that cannot be posted at all — failing exactly the case the
        # batching exists to serve.
        body_budget=60000

        parts="$RUNNER_TEMP/parts.md"
        : > "$parts"
        shown=0
        i=1
        while [ "$i" -le "$link_count" ]; do
          {
            printf '%s. [**Part %s of %s →**](%s)\n' "$i" "$i" "$link_count" "$(cat "$links/$i.url")"
            list_files "$links/$i.files" "    "
          } > "$RUNNER_TEMP/part.md"
          if [ "$(( $(wc -c < "$parts") + $(wc -c < "$RUNNER_TEMP/part.md") ))" -gt "$body_budget" ]; then
            break
          fi
          cat "$RUNNER_TEMP/part.md" >> "$parts"
          shown=$(( shown + 1 ))
          i=$(( i + 1 ))
        done
        omitted=$(( link_count - shown ))
        [ "$omitted" -eq 0 ] || echo "::notice::Omitted $omitted link(s) to keep the comment within GitHub's size limit."

        {
          echo "$marker"
          echo "### Block pattern changes"
          echo
          printf 'This pull request changes %s.\n' "$subject"
          echo

          if [ "$link_count" -eq 1 ]; then
            printf '[**View the structural diff →**](%s)\n' "$(cat "$links/1.url")"
            echo
          elif [ "$link_count" -gt 1 ]; then
            # One link cannot hold the whole diff, so the files are split across
            # several. Each link is a complete diff of the files it lists.
            printf 'The diff is too big for one link, so it is split across %s links.\n' "$link_count"
            echo
            echo "<details><summary>View the structural diff</summary>"
            echo
            cat "$parts"
            if [ "$omitted" -gt 0 ]; then
              echo
              printf '%s further part(s) are not listed, because the comment would exceed the size GitHub accepts.\n' "$omitted"
            fi
            echo
            echo "</details>"
            echo
          fi

          if [ -s "$unlinkable" ]; then
            count=$(wc -l < "$unlinkable" | tr -d ' ')
            if [ "$link_count" -eq 0 ]; then
              printf 'The diff is too large to fit in a link. Paste it into <%s> to view it.\n' "${SITE_URL%/}/"
            else
              printf 'These %s could not be linked, each being too large on its own:\n' \
                "$( [ "$count" -eq 1 ] && echo 'file' || echo 'files' )"
            fi
            echo
            list_files "$unlinkable" ""
            echo
          fi

          if [ "$link_count" -gt 1 ]; then
            echo "Each link expands its files into a block tree, so re-nesting and migrated attributes read as moves rather than as wholesale rewrites. Nothing is uploaded: the diff travels inside the link and is decoded in your browser."
          elif [ "$link_count" -eq 1 ]; then
            echo "The link expands the diff into a block tree, so re-nesting and migrated attributes read as moves rather than as wholesale rewrites. Nothing is uploaded: the diff travels inside the link and is decoded in your browser."
          else
            echo "The tool expands a diff into a block tree, so re-nesting and migrated attributes read as moves rather than as wholesale rewrites. Nothing is uploaded: a diff is decoded in your browser."
          fi

          # When the diff is split, the parts above already name every file, so
          # repeating the list here would just be noise.
          if [ "$link_count" -le 1 ]; then
            echo
            echo "<details><summary>Files</summary>"
            echo
            list_files "$RUNNER_TEMP/matched.txt" ""
            echo
            echo "</details>"
          fi
        } > "$RUNNER_TEMP/comment.md"

        if [ -n "$existing" ]; then
          # Skip the write when nothing changed, so pushes that do not touch
          # patterns don't re-notify everyone subscribed to the pull request.
          current=$(gh api "repos/$REPO/issues/comments/$existing" --jq .body)
          if [ "$current" = "$(cat "$RUNNER_TEMP/comment.md")" ]; then
            echo "Comment is already up to date."
            echo "comment_action=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
            -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          echo "Updated the existing comment."
          echo "comment_action=updated" >> "$GITHUB_OUTPUT"
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
            -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          echo "Posted a new comment."
          echo "comment_action=created" >> "$GITHUB_OUTPUT"
        fi
